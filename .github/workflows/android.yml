
name: Build ClipMaster AI APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
 -  nombre: Salida
   usos : acciones/checkout@v4

 - nombre: COnfigurar Java
    usos  : acciones/setup-java@v4
 Con :
  distribución : Temurin
  versión java : "17"

 - nombre: Configurar Gradle
  usos : gradle/actions/setup-gradle@v4
 Con :
  Grade-Versión : "8.9"

 - nombre: Configurar Android SDK
  usos : yroid-actions/setup-android@v3

 - nombre: Construir depuración APK
 Correr : gradle ensamblarDepuración

 - nombre: Cargar APK
  usos : acciones/carga-artefact@v4
 Con :
  nombre : ClipMasterAI-depuración-apk
  camino : App/build/outputs/apk/debug/app-debug.apk
 if-no-files-encontrado : error
